name: Label bei Zuweisung

# Sobald jemand zuständig ist, ist das Issue nicht mehr "neu"
on:
  issues:
    types: [assigned]

jobs:
  remove-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'status: new issue',
              });
            } catch (e) {
              core.info('Label war nicht gesetzt');
            }

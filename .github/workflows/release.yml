name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Artefakt 1: ZIP im GitHub Release (Server + Oberfläche, starten mit: npm ci --omit=dev && npm start)
      - run: zip -r notizen-app-${{ github.ref_name }}.zip server dist package.json package-lock.json .env.example
      - uses: softprops/action-gh-release@v2
        with:
          files: notizen-app-${{ github.ref_name }}.zip
          generate_release_notes: true

      # Artefakt 2: Docker-Image in der GitHub Container Registry
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE:${{ github.ref_name }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE

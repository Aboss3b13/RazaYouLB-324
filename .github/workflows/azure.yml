name: Deploy Azure

# Neue Etikette v* -> Tests mit PostgreSQL -> Auslieferung auf Azure -> Health-Check
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: razayou-notizen

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notizen
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/notizen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://razayou-notizen.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
      - name: Secret vorhanden?
        id: check
        run: echo "ok=${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}" >> $GITHUB_OUTPUT
      - if: steps.check.outputs.ok != 'true'
        run: echo "::warning::Secret AZURE_WEBAPP_PUBLISH_PROFILE fehlt - Deployment übersprungen"
      - if: steps.check.outputs.ok == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
      - name: Health-Check
        if: steps.check.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            curl -sf https://razayou-notizen.azurewebsites.net/health && exit 0
            sleep 15
          done
          exit 1

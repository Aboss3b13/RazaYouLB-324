name: Deploy Azure

# Neue Etikette v* -> Tests mit PostgreSQL -> Auslieferung auf Azure -> Health-Check
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: razayou-notizen

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notizen
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/notizen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://razayou-notizen.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
      - name: Secret vorhanden?
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::Secret AZURE_WEBAPP_PUBLISH_PROFILE fehlt - keine Auslieferung möglich"
            exit 1
          fi
      - name: Version in die App schreiben
        run: echo "${{ github.ref_name }}" > VERSION
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
      - name: Health-Check (läuft die neue Version?)
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sf https://razayou-notizen.azurewebsites.net/health || true)
            echo "$body"
            echo "$body" | grep -q '"version":"${{ github.ref_name }}"' && exit 0
            sleep 15
          done
          echo "::error::Neue Version ${{ github.ref_name }} ist nicht live"
          exit 1

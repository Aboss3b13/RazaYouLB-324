name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Echte PostgreSQL-Datenbank für die Integrationstests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notizen
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/notizen

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: Testabdeckung anzeigen
        run: |
          echo "### Testabdeckung" >> $GITHUB_STEP_SUMMARY
          node -e "const t=require('./coverage/coverage-summary.json').total;for(const k of ['lines','statements','functions','branches'])console.log('- '+k+': '+t[k].pct+'%')" >> $GITHUB_STEP_SUMMARY
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: notizen-app-dist
          path: dist

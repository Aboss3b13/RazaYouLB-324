name: CI

# Bei jedem Pull Request und jedem Push auf main: Lint + Tests gegen echte PostgreSQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notizen
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/notizen

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Formatierung (black)
        run: black --check .
      - name: Lint (flake8)
        run: flake8
      - name: Tests mit PostgreSQL und Testabdeckung
        run: pytest --cov=. --cov-report=term --cov-report=xml
      - name: Testabdeckung in der Zusammenfassung
        run: |
          python -c "import xml.etree.ElementTree as E;r=float(E.parse('coverage.xml').getroot().get('line-rate'));print(f'### Testabdeckung: {r*100:.0f} %')" >> $GITHUB_STEP_SUMMARY

# Lokal App + PostgreSQL starten:  docker compose up --build  ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notizen
      POSTGRES_PASSWORD: notizen
      POSTGRES_DB: notizen
    volumes:
      - db-data:/var/lib/postgresql/data
    # Erst "gesund", wenn PostgreSQL Verbindungen annimmt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notizen -d notizen"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DBHOST: db:5432
      DBNAME: notizen
      DBUSER: notizen
      DBPASS: notizen
    # App erst starten, wenn die Datenbank bereit ist
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  db-data:

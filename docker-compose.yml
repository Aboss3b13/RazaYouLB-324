# Lokal App + PostgreSQL starten:  docker compose up --build  ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notizen
      POSTGRES_PASSWORD: notizen
      POSTGRES_DB: notizen
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DBHOST: db:5432
      DBNAME: notizen
      DBUSER: notizen
      DBPASS: notizen
    depends_on:
      - db

volumes:
  db-data:

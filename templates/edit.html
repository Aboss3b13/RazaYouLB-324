{% extends "base.html" %}
{% block content %}
<form action="{{ url_for('edit', note_id=note.id) }}" method="post" class="card">
  <input name="title" value="{{ note.title }}" required maxlength="100" />
  <textarea name="text" rows="6">{{ note.text }}</textarea>
  <div class="row">
    <button type="submit">Speichern</button>
    <a class="button secondary" href="{{ url_for('index') }}">Abbrechen</a>
  </div>
</form>
{% endblock %}

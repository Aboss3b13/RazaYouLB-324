<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notizen</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Meine Notizen</h1>

      <form id="note-form" class="card">
        <input type="hidden" id="note-id" />
        <input id="note-title" placeholder="Titel" required maxlength="100" />
        <textarea id="note-text" placeholder="Notiz schreiben..." rows="4"></textarea>
        <div class="row">
          <button type="submit" id="save-btn">Speichern</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Abbrechen</button>
        </div>
      </form>

      <input id="search" type="search" placeholder="Suchen..." />

      <ul id="note-list"></ul>
      <p id="empty" class="muted">Noch keine Notizen.</p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
